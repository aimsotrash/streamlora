<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLoRA</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232a78d6'/><path d='M3 11l3-4 3 3 4-6' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">StreamLoRA <span class="ver">telemetry forecasting</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="overview" aria-current="page">Overview</button>
    <button data-view="forecasts">Forecasts</button>
    <button data-view="telemetry">Telemetry</button>
    <button data-view="adaptation">Adaptation</button>
    <button data-view="experiments">Experiments</button>
    <button data-view="chat">Chat</button>
  </nav>
  <div class="topbar-right">
    <span class="livedot off" id="livedot"><i></i><span id="livetext">connecting…</span></span>
    <button class="ghost" id="themebtn" type="button" title="Toggle light/dark">Theme</button>
  </div>
</header>

<main>
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-forecasts" hidden></section>
  <section class="view" id="view-telemetry" hidden></section>
  <section class="view" id="view-adaptation" hidden></section>
  <section class="view" id="view-experiments" hidden></section>
  <section class="view" id="view-chat" hidden></section>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
